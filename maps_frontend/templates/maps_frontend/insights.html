{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCR Barangay Insights</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
  <style>
    .leaflet-container path.leaflet-interactive:focus {
      outline: none;
    }
    :root { --ink:#1b2733; --soft:#5b6b7b; --line:#e3e8ee; --wash:#f6f8fa; --accent:#0f766e; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
    header { display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 56px; border-bottom: 1px solid var(--line); flex: none; }
    header h1 { margin: 0; font-size: 17px; font-weight: 650; }
    header a { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600; }
    header a:hover { text-decoration: underline; }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 390px; }
    #map { height: 100%; min-height: 320px; background: #dfe6ec; }
    aside { overflow-y: auto; padding: 18px 20px 24px; border-left: 1px solid var(--line); }
    .controls { display: grid; gap: 12px; margin-bottom: 16px; }
    label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--soft); }
    select { font: inherit; font-size: 14px; color: var(--ink); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .totals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 14px 0; }
    .totals div { padding: 10px 12px; background: var(--wash); border-radius: 10px; }
    .totals b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .totals span { font-size: 12px; color: var(--soft); }
    h2 { font-size: 14px; margin: 18px 0 8px; }
    .legend { display: grid; gap: 4px; font-size: 13px; font-variant-numeric: tabular-nums; }
    .legend div { display: flex; align-items: center; gap: 8px; }
    .legend i { width: 22px; height: 12px; border-radius: 3px; border: 1px solid rgba(27,39,51,.15); flex: none; }
    .chart-box { position: relative; height: 300px; }
    .note { margin-top: 16px; padding: 10px 12px; border: 1px solid #f3d9a4; border-radius: 10px; background: #fff8e8; color: #7a4b00; font-size: 12.5px; line-height: 1.4; }
    #status { font-size: 13px; color: var(--soft); min-height: 18px; }
    .leaflet-popup-content-wrapper { border-radius: 12px; }
    .leaflet-popup-content { font-size: 13px; line-height: 1.5; margin: 12px 14px; }
    .leaflet-popup-content strong { font-size: 14px; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; overflow-y: auto; }
      aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/maps/">&larr; Search map</a>
    <a href="/maps/quality/">Data quality</a>
     <a href="/maps/radius/">Radius analysis</a>
     <a href="/maps/density/">Density grid</a>
     <a href="/maps/clusters/">Hotspot clusters</a>
     <a href="/maps/names/">Landmark names</a>
    <h1>NCR Barangay Insights</h1>
  </header>
  <main>
    <div id="map" aria-label="Map of barangays shaded by the selected measure"></div>
    <aside>
      <div class="controls">
        <label>Show
          <select id="metric">
            <option value="landmark_density">Landmarks per km²</option>
            <option value="address_density">House numbers per km²</option>
            <option value="road_density">Road km per km²</option>
            <option value="landmark_count">Landmark count</option>
            <option value="address_count">House number count</option>
            <option value="road_km">Road length (km)</option>
            <option value="area_km2">Area (km²)</option>
          </select>
        </label>
        <label>City
          <select id="city"><option value="">All of NCR</option></select>
        </label>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="totals" id="totals"></div>
      <h2 id="legend-title">Legend</h2>
      <div class="legend" id="legend"></div>
      <h2>Top 10 barangays</h2>
      <div class="chart-box"><canvas id="top-chart" aria-label="Bar chart of the ten highest barangays"></canvas></div>
      <p class="note" id="note"></p>
    </aside>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="{% static 'javascript/insights.js' %}"></script>
</body>
</html>
